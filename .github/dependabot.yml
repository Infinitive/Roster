version: 2

updates:
  # ROSTER uses Bun and commits bun.lock.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      bun-dependencies:
        patterns:
          - "*"

  # Keep GitHub Actions themselves up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
