<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>T9 Collection Registry</title>
    <meta name="description" content="Private media collection registry, memory, and discovery system." />
    <meta property="og:title" content="T9 Collection Registry" />
    <meta property="og:description" content="Private media collection registry, memory, and discovery system." />
    <meta name="theme-color" content="#0c0e12" />
    <meta name="color-scheme" content="dark" />
    
    <!-- iOS / PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="T9" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#0c0e12] text-zinc-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('%BASE_URL%sw.js', { scope: '%BASE_URL%' })
            .catch(err => console.error('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
